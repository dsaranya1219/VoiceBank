<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBank</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        h1 { color: #2c3e50; }
        button {
            font-size: 18px; padding: 15px 30px; margin: 10px; border: none; border-radius: 8px;
            background-color: #2c3e50; color: white; cursor: pointer;
        }
        button:hover { background-color: #34495e; }
        button:focus { outline: 4px solid #f1c40f; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .form-box { display: none; margin-top: 30px; }
        input { font-size: 16px; padding: 10px; margin: 8px; border-radius: 6px; border: 1px solid #ccc; width: 220px; }
        .hint { font-size: 14px; color: #666; margin-top: -4px; }
        #result { margin-top: 25px; font-size: 20px; font-weight: bold; color: #2c3e50; }
        #status { margin-top: 10px; font-size: 18px; color: #c0392b; }
        #dashboard { display: none; margin-top: 30px; }
        #dashboard button { width: 240px; }
        #voiceToggle { background-color: #27ae60; }
        #voiceToggle.off { background-color: #7f8c8d; }
        #dashboardResult { margin-top: 20px; font-size: 20px; font-weight: bold; color: #2c3e50; white-space: pre-line; }
        #txList { margin-top: 15px; text-align: left; display: inline-block; font-size: 17px; }
    </style>
</head>
<body>
    <h1>Welcome to VoiceBank</h1>
    <p>Your voice-guided banking assistant</p>

    <div id="mainButtons">
        <button onclick="selectMode('create')">Create Account</button>
        <button onclick="selectMode('login')">Login</button>
    </div>

    <div id="createForm" class="form-box">
        <h2>Create Account</h2>
        <p class="hint">The assistant will guide you by voice. You can also type here and press Submit.</p>
        <input type="text" id="createName" placeholder="Full Name"><br>
        <input type="password" id="createPin" placeholder="4-digit PIN" maxlength="4"><br>
        <button id="createBtn" onclick="runCreateAccount()">Submit</button>
    </div>

    <div id="loginForm" class="form-box">
        <h2>Login</h2>
        <p class="hint">The assistant will guide you by voice. You can also type here and press Submit.</p>
        <input type="text" id="loginAccId" placeholder="Account Number"><br>
        <input type="password" id="loginPin" placeholder="4-digit PIN" maxlength="4"><br>
        <button id="loginBtn" onclick="runLogin()">Submit</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="result" role="status" aria-live="polite"></div>

    <div id="dashboard">
        <h2>Account Menu</h2>
        <p class="hint">Account Number: <span id="dashAccId"></span></p>
        <p class="hint" id="modeHint"></p>
        <div>
            <button id="voiceToggle" onclick="toggleVoiceMode()">Voice Mode: ON</button><br>
            <button id="btnBalance" onclick="manual(checkBalance)">Check Balance</button><br>
            <button id="btnDeposit" onclick="manual(doDeposit)">Deposit</button><br>
            <button id="btnWithdraw" onclick="manual(doWithdraw)">Withdraw</button><br>
            <button id="btnStatement" onclick="manual(getStatement)">Mini Statement</button><br>
            <button id="btnLogout" onclick="requestLogout()">Logout</button>
        </div>
        <div id="dashboardResult" role="status" aria-live="polite"></div>
        <div id="txList"></div>
    </div>

    <script>
        let loggedInAccountId = null;
        let voiceMode = true;
        let voiceLoopRunning = false;
        let busy = false;
        let logoutRequested = false;

        const $ = (id) => document.getElementById(id);
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function post(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return res.json();
        }

        function speakText(text) {
            fetch('/api/speak', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
        }

        function setButtonsEnabled(enabled) {
            $('createBtn').disabled = !enabled;
            $('loginBtn').disabled = !enabled;
        }

        function setDash(text) { $('dashboardResult').innerText = text; }

        // ---------- automatic mode selection (no click needed) ----------

        async function startModeListening() {
            $('status').innerText = "Listening: say 'create account' or 'login'...";
            try {
                const data = await post('/api/mode_flow', {});
                $('status').innerText = "";
                if (data.mode === 'create' || data.mode === 'login') {
                    await selectMode(data.mode);
                } else {
                    speakText("You can also press Create Account or Login on the screen.");
                }
            } catch (e) {
                $('status').innerText = "";
            }
        }

        // ---------- create account / login ----------

        async function selectMode(type) {
            $('createForm').style.display = (type === 'create') ? 'block' : 'none';
            $('loginForm').style.display = (type === 'login') ? 'block' : 'none';
            $('result').innerText = '';
            if (type === 'create') { await runCreateAccount(); } else { await runLogin(); }
        }

        async function runCreateAccount() {
            setButtonsEnabled(false);
            $('status').innerText = "Follow the voice instructions, or type above and press Submit.";
            $('result').innerText = "";
            try {
                const data = await post('/api/create_account_flow', {
                    name: $('createName').value, pin: $('createPin').value
                });
                $('status').innerText = "";
                if (data.success) {
                    $('result').innerText = "Account created for " + data.name + "! Account number: " + data.account_id;
                } else {
                    $('result').innerText = data.message || "Something went wrong. Please try again.";
                }
            } catch (e) {
                $('status').innerText = "";
                $('result').innerText = "Could not reach the server.";
            }
            setButtonsEnabled(true);
        }

        async function runLogin() {
            setButtonsEnabled(false);
            $('status').innerText = "Follow the voice instructions, or type above and press Submit.";
            $('result').innerText = "";
            try {
                const data = await post('/api/login_flow', {
                    account_id: $('loginAccId').value, pin: $('loginPin').value
                });
                $('status').innerText = "";
                setButtonsEnabled(true);
                if (data.success) {
                    loggedInAccountId = data.account_id;
                    showDashboard();
                    startVoiceMode();
                } else {
                    $('result').innerText = data.message || "Login failed. Please try again.";
                }
            } catch (e) {
                $('status').innerText = "";
                $('result').innerText = "Could not reach the server.";
                setButtonsEnabled(true);
            }
        }

        // ---------- dashboard ----------

        function refreshDashboardButtons() {
            ['btnBalance', 'btnDeposit', 'btnWithdraw', 'btnStatement'].forEach(id => {
                $(id).disabled = voiceMode;
            });
            $('voiceToggle').innerText = voiceMode ? "Voice Mode: ON" : "Voice Mode: OFF";
            $('voiceToggle').classList.toggle('off', !voiceMode);
            $('modeHint').innerText = voiceMode
                ? "Voice Mode is on: the assistant reads the options and listens to you. Turn it off to use the buttons."
                : "Voice Mode is off. Use the buttons, or turn Voice Mode on.";
        }

        function showDashboard() {
            $('mainButtons').style.display = 'none';
            $('createForm').style.display = 'none';
            $('loginForm').style.display = 'none';
            $('result').innerText = '';
            setDash('');
            $('txList').innerHTML = '';
            $('dashAccId').innerText = loggedInAccountId;
            $('dashboard').style.display = 'block';
            voiceMode = true;
            logoutRequested = false;
            refreshDashboardButtons();
        }

        function finishLogout(message) {
            loggedInAccountId = null;
            voiceMode = false;
            logoutRequested = false;
            $('dashboard').style.display = 'none';
            $('mainButtons').style.display = 'block';
            $('loginAccId').value = '';
            $('loginPin').value = '';
            $('result').innerText = message || '';
            if (message) { speakText(message); }
        }

        async function requestLogout() {
            if (busy) {
                logoutRequested = true;
                voiceMode = false;
                setDash("Logging out after the current step...");
                return;
            }
            finishLogout("You have been logged out safely.");
        }

        function toggleVoiceMode() {
            voiceMode = !voiceMode;
            refreshDashboardButtons();
            if (voiceMode) { startVoiceMode(); }
        }

        // ---------- voice mode loop ----------

        function showResult(data) {
            setDash(data.message || '');
            if (data.action === 'statement') {
                if (data.transactions && data.transactions.length > 0) {
                    let html = "<ul>";
                    data.transactions.forEach(tx => {
                        html += `<li>${tx.type} of ${Number(tx.amount).toFixed(2)} rupees on ${tx.when}</li>`;
                    });
                    $('txList').innerHTML = html + "</ul>";
                } else {
                    $('txList').innerText = "No recent transactions.";
                }
            } else {
                $('txList').innerHTML = '';
            }
        }

        function startVoiceMode() {
            if (!voiceLoopRunning) { voiceLoop(); }
        }

        async function voiceLoop() {
            voiceLoopRunning = true;
            let first = true;
            let misses = 0;

            while (voiceMode && loggedInAccountId !== null) {
                busy = true;
                setDash("Listening for your command...");
                let data;
                try {
                    data = await post('/api/voice_menu', { account_id: loggedInAccountId, first });
                } catch (e) {
                    busy = false;
                    setDash("Connection problem. Voice Mode stopped.");
                    voiceMode = false;
                    refreshDashboardButtons();
                    break;
                }
                busy = false;

                if (data.action === undefined) {   // server was busy with another step
                    await sleep(2000);
                    continue;
                }
                first = false;
                showResult(data);

                if (logoutRequested || data.action === 'logout') {
                    finishLogout(logoutRequested && data.action !== 'logout' ? "You have been logged out safely." : "");
                    break;
                }

                if (data.action === 'none' || data.action === 'unknown') { misses++; } else { misses = 0; }
                if (misses >= 3) {
                    finishLogout("No response was heard, so for your security you have been logged out.");
                    break;
                }
            }

            voiceLoopRunning = false;
            if (loggedInAccountId !== null) { refreshDashboardButtons(); }
        }

        // ---------- button versions (Voice Mode off) ----------

        async function manual(fn) {
            if (busy) { setDash("Please wait, the assistant is still working."); return; }
            busy = true;
            try { await fn(); } catch (e) { setDash("Something went wrong."); }
            busy = false;
        }

        async function checkBalance() {
            setDash("Checking...");
            const data = await post('/api/balance', { account_id: loggedInAccountId });
            setDash(data.balance !== undefined ? "Balance: " + Number(data.balance).toFixed(2) + " rupees" : data.message);
        }

        async function doDeposit() {
            setDash("Listening for the amount to deposit...");
            const data = await post('/api/deposit', { account_id: loggedInAccountId, amount: "" });
            setDash(data.message);
        }

        async function doWithdraw() {
            setDash("Listening for the amount, then for voice verification...");
            const data = await post('/api/withdraw', { account_id: loggedInAccountId, amount: "" });
            setDash(data.message);
        }

        async function getStatement() {
            setDash("Fetching statement...");
            $('txList').innerHTML = '';
            const data = await post('/api/statement', { account_id: loggedInAccountId });
            setDash(data.message || "");
            if (data.transactions !== undefined) {
                showResult({ action: 'statement', message: '', transactions: data.transactions });
            }
        }

        window.onload = function () {
            startModeListening();
        };
    </script>
</body>
</html>
